<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Station Météo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d131a;
      color: #e6edf3;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 18px 25px;
      overflow: hidden;
      -webkit-user-select: none;
    }
    
    /* En-tête : Ville, Date & Horloge */
    .header {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: flex-end;
      align-items: flex-end;
      border-bottom: 2px solid #21262d;
      padding-bottom: 10px;
    }
    .city-date .city {
      font-size: 26px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .city-date .date {
      font-size: 19px;
      color: #8b949e;
      margin-top: 3px;
    }
    .clock {
      font-size: 50px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #f0f6fc;
      line-height: 1;
    }

    /* Ligne centrale : Météo actuelle + Encart H+4 */
    .middle-row {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      margin: 15px 0;
    }
    .current-card {
      width: 71%;
      background: #161b22;
      border-radius: 12px;
      padding: 18px 25px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      border: 1px solid #30363d;
    }
    .current-left {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
    }
    .current-icon {
      width: 100px;
      height: 100px;
      margin-right: 22px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }
    .current-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .current-temp {
      font-size: 78px;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
    }
    .current-condition {
      font-size: 22px;
      color: #8b949e;
      margin-top: 6px;
    }
    .current-details {
      text-align: right;
      font-size: 19px;
      color: #c9d1d9;
      line-height: 1.7;
    }
    .current-details strong {
      color: #58a6ff;
    }

    /* Encart H+4 */
    .plus4-card {
      width: 27%;
      background: #161b22;
      border-radius: 12px;
      padding: 15px 18px;
      border: 1px solid #30363d;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      text-align: center;
    }
    .plus4-header {
      font-size: 15px;
      font-weight: 700;
      color: #58a6ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .plus4-body {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin: 6px 0;
    }
    .plus4-icon {
      width: 58px;
      height: 58px;
      margin-right: 12px;
    }
    .plus4-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .plus4-temp {
      font-size: 42px;
      font-weight: 700;
      color: #ffffff;
    }
    .plus4-desc {
      font-size: 17px;
      color: #8b949e;
    }

    /* Prévisions sur 4 jours */
    .forecast-grid {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }
    .forecast-day {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 23.8%;
      padding: 15px 12px;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }
    .day-head {
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: baseline;
      align-items: baseline;
    }
    .day-name {
      font-size: 18px;
      font-weight: 700;
      color: #58a6ff;
      text-transform: uppercase;
    }
    .day-range {
      font-size: 17px;
    }
    .temp-max {
      font-weight: 700;
      color: #ff7b72;
    }
    .temp-min {
      color: #79c0ff;
      margin-left: 6px;
    }

    /* Sous-blocs Matin & Après-midi */
    .slot-card {
      background: #0d131a;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
    }
    .slot-badge {
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .slot-body {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }
    .slot-icon {
      width: 48px;
      height: 48px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }
    .slot-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .slot-temp {
      font-size: 30px;
      font-weight: 700;
      color: #f0f6fc;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="city-date">
      <div class="city" id="city-name">Montpellier</div>
      <div class="date" id="current-date">--</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="middle-row">
    <!-- Météo en direct -->
    <div class="current-card">
      <div class="current-left">
        <div class="current-icon" id="current-icon">⏳</div>
        <div>
          <div class="current-temp" id="current-temp">--°</div>
          <div class="current-condition" id="current-desc">Chargement...</div>
        </div>
      </div>
      <div class="current-details">
        <div>Humidité : <strong id="current-humidity">-- %</strong></div>
        <div>Vent : <strong id="current-wind">-- km/h</strong></div>
        <div>Aujourd'hui : <strong id="today-range">--° / --°</strong></div>
      </div>
    </div>

    <!-- Météo dans 4 heures -->
    <div class="plus4-card">
      <div class="plus4-header">Dans 4h (<span id="plus4-time">--:--</span>)</div>
      <div class="plus4-body">
        <div class="plus4-icon" id="plus4-icon"></div>
        <div class="plus4-temp" id="plus4-temp">--°</div>
      </div>
      <div class="plus4-desc" id="plus4-desc">Chargement...</div>
    </div>
  </div>

  <!-- Prévisions 4 jours x 2 créneaux -->
  <div class="forecast-grid" id="forecast-container">
    <!-- Rempli par JavaScript -->
  </div>

  <script>
    // Configuration géographique
    var LAT = 43.6108;
    var LON = 3.8767;
    var CITY = "Montpellier";

    document.getElementById("city-name").innerText = CITY;

    // Horloge
    var daysFR = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
    var monthsFR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var s = now.getSeconds();
      
      h = (h < 10 ? "0" : "") + h;
      m = (m < 10 ? "0" : "") + m;
      s = (s < 10 ? "0" : "") + s;

      document.getElementById("clock").innerText = h + ":" + m + ":" + s;
      document.getElementById("current-date").innerText = daysFR[now.getDay()] + " " + now.getDate() + " " + monthsFR[now.getMonth()];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Dictionnaire SVG vectoriel
    var ICONS = {
      sun: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#fbc02d"/><g stroke="#fbc02d" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="14" y1="14" x2="18" y2="18"/><line x1="46" y1="46" x2="50" y2="50"/><line x1="14" y1="50" x2="18" y2="46"/><line x1="46" y1="18" x2="50" y2="14"/></g></svg>',
      sun_cloud: '<svg viewBox="0 0 64 64"><circle cx="25" cy="25" r="11" fill="#fbc02d"/><g stroke="#fbc02d" stroke-width="3" stroke-linecap="round"><line x1="25" y1="6" x2="25" y2="10"/><line x1="11.5" y1="11.5" x2="14.5" y2="14.5"/><line x1="6" y1="25" x2="10" y2="25"/></g><path d="M25 48h22a10 10 0 0 0 1-19.9 13 13 0 0 0-25-2.6A10 10 0 0 0 25 48z" fill="#90a4ae"/></svg>',
      cloud: '<svg viewBox="0 0 64 64"><path d="M20 46h25a11 11 0 0 0 1.5-21.9 15 15 0 0 0-28.7-2.6A11 11 0 0 0 20 46z" fill="#90a4ae"/></svg>',
      rain: '<svg viewBox="0 0 64 64"><path d="M18 38h25a10 10 0 0 0 1-19.9 13 13 0 0 0-25-2.6A10 10 0 0 0 18 38z" fill="#78909c"/><g stroke="#4fc3f7" stroke-width="3.5" stroke-linecap="round"><line x1="22" y1="44" x2="18" y2="54"/><line x1="32" y1="44" x2="28" y2="54"/><line x1="42" y1="44" x2="38" y2="54"/></g></svg>',
      drizzle: '<svg viewBox="0 0 64 64"><path d="M18 38h25a10 10 0 0 0 1-19.9 13 13 0 0 0-25-2.6A10 10 0 0 0 18 38z" fill="#90a4ae"/><g stroke="#81d4fa" stroke-width="3" stroke-linecap="round"><line x1="24" y1="44" x2="24" y2="48"/><line x1="34" y1="44" x2="34" y2="48"/><line x1="44" y1="44" x2="44" y2="48"/></g></svg>',
      thunder: '<svg viewBox="0 0 64 64"><path d="M18 36h25a10 10 0 0 0 1-19.9 13 13 0 0 0-25-2.6A10 10 0 0 0 18 36z" fill="#546e7a"/><polygon points="31,34 23,47 30,47 27,58 39,44 32,44" fill="#ffd54f"/></svg>',
      snow: '<svg viewBox="0 0 64 64"><path d="M18 38h25a10 10 0 0 0 1-19.9 13 13 0 0 0-25-2.6A10 10 0 0 0 18 38z" fill="#90a4ae"/><circle cx="22" cy="47" r="2.5" fill="#e1f5fe"/><circle cx="32" cy="47" r="2.5" fill="#e1f5fe"/><circle cx="42" cy="47" r="2.5" fill="#e1f5fe"/><circle cx="27" cy="54" r="2.5" fill="#e1f5fe"/><circle cx="37" cy="54" r="2.5" fill="#e1f5fe"/></svg>',
      fog: '<svg viewBox="0 0 64 64" stroke="#90a4ae" stroke-width="4" stroke-linecap="round"><line x1="14" y1="24" x2="50" y2="24"/><line x1="10" y1="32" x2="54" y2="32"/><line x1="16" y1="40" x2="48" y2="40"/><line x1="20" y1="48" x2="44" y2="48"/></svg>'
    };

    function parseWMO(code) {
      if (code === 0) return { desc: "Ensoleillé", icon: ICONS.sun };
      if (code === 1 || code === 2) return { desc: "Éclaircies", icon: ICONS.sun_cloud };
      if (code === 3) return { desc: "Couvert", icon: ICONS.cloud };
      if (code === 45 || code === 48) return { desc: "Brouillard", icon: ICONS.fog };
      if (code >= 51 && code <= 57) return { desc: "Bruine", icon: ICONS.drizzle };
      if (code >= 61 && code <= 67) return { desc: "Pluie", icon: ICONS.rain };
      if (code >= 71 && code <= 77) return { desc: "Neige", icon: ICONS.snow };
      if (code >= 80 && code <= 82) return { desc: "Averses", icon: ICONS.rain };
      if (code >= 85 && code <= 86) return { desc: "Neige forte", icon: ICONS.snow };
      if (code >= 95 && code <= 99) return { desc: "Orage", icon: ICONS.thunder };
      return { desc: "Variable", icon: ICONS.sun_cloud };
    }

    // Récupération des données Open-Meteo
    function fetchWeather() {
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + 
                "&longitude=" + LON + 
                "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" + 
                "&hourly=temperature_2m,weather_code" + 
                "&daily=weather_code,temperature_2m_max,temperature_2m_min" + 
                "&timezone=auto";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            renderWeather(data);
          } else {
            document.getElementById("current-desc").innerText = "Erreur HTTP " + xhr.status;
          }
        }
      };
      xhr.onerror = function() {
        document.getElementById("current-desc").innerText = "Erreur réseau / SSL";
      };
      xhr.send();
    }

    function renderWeather(data) {
      var cur = data.current;
      var daily = data.daily;
      var hourly = data.hourly;
      var curWMO = parseWMO(cur.weather_code);

      // 1. Météo actuelle
      document.getElementById("current-temp").innerText = Math.round(cur.temperature_2m) + "°";
      document.getElementById("current-desc").innerText = curWMO.desc;
      document.getElementById("current-icon").innerHTML = curWMO.icon;
      document.getElementById("current-humidity").innerText = cur.relative_humidity_2m + " %";
      document.getElementById("current-wind").innerText = Math.round(cur.wind_speed_10m) + " km/h";
      document.getElementById("today-range").innerText = Math.round(daily.temperature_2m_max[0]) + "° / " + Math.round(daily.temperature_2m_min[0]) + "°";

      // 2. Encart H+4
      var curPrefix = cur.time.substr(0, 13);
      var curIdx = -1;
      for (var i = 0; i < hourly.time.length; i++) {
        if (hourly.time[i].indexOf(curPrefix) === 0) {
          curIdx = i;
          break;
        }
      }
      var targetIdx = (curIdx !== -1 && curIdx + 4 < hourly.time.length) ? (curIdx + 4) : 4;
      var plus4Hour = hourly.time[targetIdx].substr(11, 5);
      var plus4WMO = parseWMO(hourly.weather_code[targetIdx]);
      
      document.getElementById("plus4-time").innerText = plus4Hour;
      document.getElementById("plus4-temp").innerText = Math.round(hourly.temperature_2m[targetIdx]) + "°";
      document.getElementById("plus4-icon").innerHTML = plus4WMO.icon;
      document.getElementById("plus4-desc").innerText = plus4WMO.desc;

      // 3. Prévisions sur 4 jours (J+1 à J+4) avec créneaux Matin et Après-midi
      var shortDays = ["Dim.", "Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam."];
      var html = "";

      for (var d = 1; d <= 4; d++) {
        var dateStr = daily.time[d];
        var parts = dateStr.split("-");
        var dDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        var dayName = shortDays[dDate.getDay()] + " " + dDate.getDate();
        
        var tMax = Math.round(daily.temperature_2m_max[d]);
        var tMin = Math.round(daily.temperature_2m_min[d]);

        // Recherche des heures de 9h et 15h
        var mornTarget = dateStr + "T09:00";
        var aftTarget = dateStr + "T15:00";
        var mornTemp = "--", mornIcon = "", aftTemp = "--", aftIcon = "";

        for (var h = 0; h < hourly.time.length; h++) {
          if (hourly.time[h] === mornTarget) {
            mornTemp = Math.round(hourly.temperature_2m[h]) + "°";
            mornIcon = parseWMO(hourly.weather_code[h]).icon;
          }
          if (hourly.time[h] === aftTarget) {
            aftTemp = Math.round(hourly.temperature_2m[h]) + "°";
            aftIcon = parseWMO(hourly.weather_code[h]).icon;
          }
        }

        // Valeurs de repli si l'horaire précis n'est pas trouvé
        if (!mornIcon) {
          mornIcon = parseWMO(daily.weather_code[d]).icon;
          mornTemp = tMin + "°";
        }
        if (!aftIcon) {
          aftIcon = parseWMO(daily.weather_code[d]).icon;
          aftTemp = tMax + "°";
        }

        html += '<div class="forecast-day">' +
                  '<div class="day-head">' +
                    '<div class="day-name">' + dayName + '</div>' +
                    '<div class="day-range">' +
                      '<span class="temp-max">' + tMax + '°</span>' +
                      '<span class="temp-min">' + tMin + '°</span>' +
                    '</div>' +
                  '</div>' +
                  '<div class="slot-card">' +
                    '<div class="slot-badge">Matin (9h)</div>' +
                    '<div class="slot-body">' +
                      '<div class="slot-icon">' + mornIcon + '</div>' +
                      '<div class="slot-temp">' + mornTemp + '</div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="slot-card">' +
                    '<div class="slot-badge">Après-midi (15h)</div>' +
                    '<div class="slot-body">' +
                      '<div class="slot-icon">' + aftIcon + '</div>' +
                      '<div class="slot-temp">' + aftTemp + '</div>' +
                    '</div>' +
                  '</div>' +
                '</div>';
      }
      document.getElementById("forecast-container").innerHTML = html;
    }

    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
